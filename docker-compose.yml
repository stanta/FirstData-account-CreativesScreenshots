services:
  reports-ad-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: reports-ad:local
    init: true
    restart: unless-stopped
    environment:
      REPORTS_AD_TELEGRAM_TOKEN: ${REPORTS_AD_TELEGRAM_TOKEN:-}
      REPORTS_AD_HEADLESS: ${REPORTS_AD_HEADLESS:-1}
      REPORTS_AD_ALLOW_LOCAL_URLS: ${REPORTS_AD_ALLOW_LOCAL_URLS:-0}
      REPORTS_AD_ALLOW_LOCAL_CREATIVE_PATH: ${REPORTS_AD_ALLOW_LOCAL_CREATIVE_PATH:-0}
      REPORTS_AD_VIEWPORT_WIDTH: ${REPORTS_AD_VIEWPORT_WIDTH:-1365}
      REPORTS_AD_VIEWPORT_HEIGHT: ${REPORTS_AD_VIEWPORT_HEIGHT:-768}
      REPORTS_AD_MAX_CREATIVE_BYTES: ${REPORTS_AD_MAX_CREATIVE_BYTES:-10485760}
      REPORTS_AD_MAX_CREATIVE_PIXELS: ${REPORTS_AD_MAX_CREATIVE_PIXELS:-20000000}
      REPORTS_AD_MAX_SCREENSHOT_BYTES: ${REPORTS_AD_MAX_SCREENSHOT_BYTES:-10485760}
      REPORTS_AD_MAX_SCREENSHOT_PIXELS: ${REPORTS_AD_MAX_SCREENSHOT_PIXELS:-30000000}
      REPORTS_AD_REQUEST_TIMEOUT_SECONDS: ${REPORTS_AD_REQUEST_TIMEOUT_SECONDS:-300}
      REPORTS_AD_PAGE_LOAD_TIMEOUT_MS: ${REPORTS_AD_PAGE_LOAD_TIMEOUT_MS:-12000}
      REPORTS_AD_CLICK_TIMEOUT_MS: ${REPORTS_AD_CLICK_TIMEOUT_MS:-7000}
      REPORTS_AD_SCREENSHOT_TIMEOUT_MS: ${REPORTS_AD_SCREENSHOT_TIMEOUT_MS:-15000}
      REPORTS_AD_TIMEOUT_DIAGNOSTICS: ${REPORTS_AD_TIMEOUT_DIAGNOSTICS:-1}
      REPORTS_AD_TIMEOUT_DIAGNOSTICS_TIMEOUT_MS: ${REPORTS_AD_TIMEOUT_DIAGNOSTICS_TIMEOUT_MS:-5000}
      REPORTS_AD_LOCALE: ${REPORTS_AD_LOCALE:-ru-RU}
      REPORTS_AD_TIMEZONE: ${REPORTS_AD_TIMEZONE:-Europe/Moscow}
      OCR_LLM_BASE_URL: ${OCR_LLM_BASE_URL:-}
      OCR_LLM_MODEL: ${OCR_LLM_MODEL:-cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit}
      OCR_LLM_USER: ${OCR_LLM_USER:-}
      OCR_LLM_PASSWORD: ${OCR_LLM_PASSWORD:-}
      OCR_LLM_HEADER_AUTHORISATION: ${OCR_LLM_HEADER_AUTHORISATION:-}
      OCR_LLM_TIMEOUT_SECONDS: ${OCR_LLM_TIMEOUT_SECONDS:-20}
      OCR_LLM_MAX_RETRIES: ${OCR_LLM_MAX_RETRIES:-5}
      OCR_LLM_CONFIDENCE_THRESHOLD: ${OCR_LLM_CONFIDENCE_THRESHOLD:-0.45}
      REPORTS_AD_OCR_IMAGE_MAX_WIDTH: ${REPORTS_AD_OCR_IMAGE_MAX_WIDTH:-1280}
      REPORTS_AD_OCR_IMAGE_MAX_PIXELS: ${REPORTS_AD_OCR_IMAGE_MAX_PIXELS:-2000000}
      REPORTS_AD_TEMP_ROOT: /tmp/reports-ad
    shm_size: "1gb"
    tmpfs:
      - /tmp/reports-ad:size=256m,mode=1777
    volumes:
      - ./tmp:/app/tmp
