[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reports-ad"
version = "0.1.0"
description = "Telegram polling bot and Playwright proof screenshot generator for advertising reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "CairoSVG>=2.7.0",
  "httpx>=0.27.0",
  "Pillow>=10.0.0",
  # "playwright>=1.45.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "python-telegram-bot>=21.0,<23.0",
  "telegram_menu>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]
telegram-e2e = [
  "kurigram>=2.1,<3",
  "TgCrypto>=1.2.5,<2",
]

[project.scripts]
reports-ad-bot = "reports_ad.bot:main"
reports-ad-diagnostics = "reports_ad.diagnostics:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reports_ad*"]

[tool.setuptools.package-data]
reports_ad = ["data/*.json", "data/masks/*/*.png", "data/masks/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "telegram_e2e: opt-in live Telegram end-to-end tests driven by Kurigram",
  "network: tests that access external network services",
  "slow: tests expected to run slower than the unit suite",
  "quarantine: temporarily excluded or non-release-blocking flaky tests",
]
